name: terraform-validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [terraform/aws, terraform/azure, terraform/gcp]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6
      - name: Format check
        run: terraform -chdir=${{ matrix.module }} fmt -check -recursive
      - name: Init without backend
        run: terraform -chdir=${{ matrix.module }} init -backend=false
      - name: Validate
        run: terraform -chdir=${{ matrix.module }} validate
